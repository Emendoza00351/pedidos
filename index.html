<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>Anótame tu pedido</title>
  <style>
    :root {
      --primario: #0F766E;
      --claro: #E7F6EF;
      --fondo: #F4F6F5;
      --tarjeta: #FFFFFF;
      --texto: #1F2937;
      --suave: #6B7280;
      --borde: #E5E7EB;
      --peligro: #DC2626;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--fondo); color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px; line-height: 1.4;
    }
    header { background: var(--primario); color: #fff; padding: 20px 16px 24px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 6px 0 0; opacity: .9; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; padding-bottom: 110px; }
    .tarjeta { background: var(--tarjeta); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
    label { font-size: 13px; font-weight: 600; color: var(--suave); display: grid; gap: 4px; }
    input, select, textarea {
      font: inherit; color: var(--texto); background: #fff; width: 100%;
      border: 1px solid var(--borde); border-radius: 10px; padding: 11px 12px;
    }
    textarea { min-height: 70px; resize: vertical; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      font: inherit; font-weight: 700; border-radius: 12px; padding: 13px 16px; cursor: pointer;
      border: 1.5px solid var(--primario); background: var(--primario); color: #fff; width: 100%;
    }
    button.sec { background: #fff; color: var(--primario); }
    h2 { margin: 0; font-size: 17px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--borde); }
    li:first-child { border-top: none; }
    li .info { flex: 1; min-width: 0; }
    li .nombre { font-weight: 600; }
    li .det { font-size: 13px; color: var(--suave); }
    li button { width: auto; padding: 6px 10px; background: #fff; color: var(--peligro); border-color: var(--peligro); font-size: 14px; }
    .vacio { color: var(--suave); text-align: center; padding: 8px; }
    .grupo { font-weight: 800; color: var(--primario); margin-top: 6px; }
    .enviar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--fondo) 30%); }
    .enviar button { max-width: 560px; margin: 0 auto; display: block; background: #16A34A; border-color: #16A34A; font-size: 17px; }
    .enviar button:disabled { opacity: .45; }
    .ok { color: #16A34A; text-align: center; font-weight: 700; min-height: 1.4em; }
    .modos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modos button { background: #fff; color: var(--texto); border: 1.5px solid var(--borde); padding: 12px 8px; line-height: 1.25; }
    .modos button small { display: block; font-weight: 500; color: var(--suave); font-size: 12px; margin-top: 2px; }
    .modos button.activo { background: var(--claro); border-color: var(--primario); color: var(--primario); }
    .pago { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pago label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--borde); border-radius: 10px; padding: 10px; color: var(--texto); font-size: 15px; font-weight: 500; }
    .pago input { width: auto; }
    .punto { display: grid; gap: 10px; border: 1px solid var(--borde); border-radius: 12px; padding: 12px; background: #FBFCFC; }
    .punto-titulo { font-weight: 800; color: var(--primario); }
    .ubic { display: grid; gap: 6px; }
    .ubic button { padding: 10px; font-size: 15px; }
    .ubic input.listo { border-color: #16A34A; background: #F0FDF4; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Anótame lo que necesitas</h1>
    <p id="saludo">Escribe qué necesitas y de dónde lo necesitas.</p>
  </header>

  <main>
    <section class="tarjeta">
      <label>Tu nombre
        <input id="quien" placeholder="Ej. Mamá, Don Carlos" autocomplete="name" />
      </label>
      <label>Tu teléfono (opcional, para que te puedan llamar)
        <input id="quienTel" type="tel" placeholder="Ej. 504 9999 8888" autocomplete="tel" />
      </label>
    </section>

    <form class="tarjeta" id="form">
      <h2>¿Qué necesitas?</h2>
      <div class="modos">
        <button type="button" id="modoCompra" class="activo">🛒 Compra<small>Que te compren algo</small></button>
        <button type="button" id="modoMandado">📦 Mandado<small>Traer o llevar algo</small></button>
      </div>
      <label><span id="etiquetaNombre">Producto</span>
        <input id="nombre" placeholder="Ej. Arroz, clavos, concentrado" required autocomplete="off" />
      </label>

      <div id="soloCompra" style="display:grid; gap:10px">
        <div class="fila">
          <label>Cantidad (opcional)
            <input id="cantidad" placeholder="Ej. 2 lb, 1 galón" autocomplete="off" />
          </label>
          <label>¿De dónde? (opcional)
            <select id="lugar"></select>
          </label>
        </div>
        <label id="otroLugarWrap" hidden>Nombre del lugar
          <input id="otroLugar" placeholder="Ej. Ferretería El Martillo" />
        </label>
        <label>Categoría (opcional)
          <select id="categoria"></select>
        </label>
      </div>

      <div id="soloMandado" hidden style="display:grid; gap:10px">
        <div class="punto">
          <div class="punto-titulo">📍 Recoger en</div>
          <label>Lugar o persona
            <input id="lugarMandado" placeholder="Ej. Agencia Cargo Expreso, Doña Rosa" autocomplete="off" />
          </label>
          <label>Dirección
            <textarea id="direccion" placeholder="Ej. Col. Kennedy, 2 cuadras al sur del parque"></textarea>
          </label>
          <label>Teléfono
            <input id="telefono" type="tel" placeholder="Ej. 504 9999 8888" autocomplete="off" />
          </label>
          <div class="ubic">
            <button type="button" class="sec" data-ubic="ubicacion">📍 Usar mi ubicación actual</button>
            <input id="ubicacion" placeholder="O pega un enlace de Google Maps" autocomplete="off" />
          </div>
        </div>
        <div class="punto">
          <div class="punto-titulo">🏁 Entregar en</div>
          <label>¿A quién se entrega?
            <input id="entregaContacto" placeholder="Ej. Doña María" autocomplete="off" />
          </label>
          <label>Dirección de entrega
            <textarea id="entrega" placeholder="Ej. Res. Las Uvas, casa 25"></textarea>
          </label>
          <label>Teléfono de quien recibe
            <input id="entregaTelefono" type="tel" placeholder="Ej. 504 9999 8888" autocomplete="off" />
          </label>
          <div class="ubic">
            <button type="button" class="sec" data-ubic="entregaUbicacion">📍 Usar mi ubicación actual</button>
            <input id="entregaUbicacion" placeholder="O pega un enlace de Google Maps" autocomplete="off" />
          </div>
        </div>
        <div>
          <label style="margin-bottom:6px">Pago</label>
          <div class="pago">
            <label><input type="radio" name="pago" value="pagar" checked /> Hay que pagarlo</label>
            <label><input type="radio" name="pago" value="pagado" /> ✅ Ya está pagado</label>
          </div>
        </div>
      </div>

      <label><span id="etiquetaNota">Nota (marca, tamaño, color…)</span>
        <input id="nota" placeholder="Opcional" autocomplete="off" />
      </label>
      <button type="submit">＋ Agregar a mi lista</button>
      <div class="ok" id="ok"></div>
    </form>

    <section class="tarjeta">
      <h2>Mi lista (<span id="cuenta">0</span>)</h2>
      <div id="lista"></div>
    </section>

    <section class="tarjeta">
      <label>Nota general (opcional)
        <textarea id="notaGeneral" placeholder="Ej. Si no hay de esa marca, trae otra"></textarea>
      </label>
    </section>
  </main>

  <div class="enviar">
    <button id="enviar" disabled>Enviar por WhatsApp</button>
  </div>

  <script>
    // La codificación debe coincidir con mandados/src/lib/pedido.ts
    const params = new URLSearchParams(location.search);
    const para = params.get('de') || '';
    const tel = (params.get('tel') || '').replace(/\D/g, '');
    const categorias = (params.get('cats') || '🥫 Abarrotes|🥩 Carnes y pescado|🥛 Lácteos y huevos|🥬 Frutas y verduras|🍞 Panadería|🥤 Bebidas|🧽 Limpieza|🧴 Higiene personal|💊 Farmacia|🍼 Bebé|🐶 Mascotas|🏠 Hogar|🔧 Ferretería|🌾 Agropecuaria|📦 Otros').split('|').filter(Boolean);
    const lugares = (params.get('lug') || 'Supermercado|Mercado|Pulpería|Ferretería|Agropecuaria|Farmacia|Panadería|Tienda|Otro').split('|').filter(Boolean);

    const $ = (id) => document.getElementById(id);
    const CLAVE = 'pedido-borrador:' + para + tel;
    let items = [];
    try { const b = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (b) { items = b.items || []; $('quien').value = b.quien || ''; $('notaGeneral').value = b.nota || ''; } } catch (e) {}

    if (para) $('saludo').textContent = `${para} te hace el mandado. Escribe qué necesitas y de dónde lo necesitas.`;
    try { if (!$('quien').value) $('quien').value = localStorage.getItem('pedido-nombre') || ''; $('quienTel').value = localStorage.getItem('pedido-tel') || ''; } catch (e) {}

    $('lugar').innerHTML = '<option value="">— Cualquiera —</option>' +
      lugares.map((l) => `<option>${esc(l)}</option>`).join('') + '<option value="__otro">Otro lugar…</option>';
    $('categoria').innerHTML = '<option value="">— No sé / que la app la elija —</option>' + categorias.map((c) => `<option>${esc(c)}</option>`).join('');

    $('lugar').addEventListener('change', () => { $('otroLugarWrap').hidden = $('lugar').value !== '__otro'; });

    // Compra = que te compren algo; Mandado = ir a traer o llevar algo
    let modo = 'compra';
    function cambiarModo(nuevo) {
      modo = nuevo;
      const mandado = modo === 'mandado';
      $('modoCompra').classList.toggle('activo', !mandado);
      $('modoMandado').classList.toggle('activo', mandado);
      $('soloCompra').hidden = mandado;
      $('soloMandado').hidden = !mandado;
      $('etiquetaNombre').textContent = mandado ? '¿Qué hay que traer o llevar?' : 'Producto';
      $('nombre').placeholder = mandado ? 'Ej. Paquete, documentos, pedido de comida' : 'Ej. Arroz, clavos, concentrado';
      $('etiquetaNota').textContent = mandado ? 'Nota (a nombre de quién, número de guía…)' : 'Nota (marca, tamaño, color…)';
    }
    // "Usar mi ubicación actual" → enlace de Google Maps con las coordenadas
    document.querySelectorAll('[data-ubic]').forEach((boton) => {
      boton.addEventListener('click', () => {
        const campo = $(boton.getAttribute('data-ubic'));
        if (!navigator.geolocation) { alert('Este teléfono no permite compartir la ubicación desde aquí. Pega un enlace de Google Maps.'); return; }
        const texto = boton.textContent;
        boton.textContent = 'Buscando ubicación…'; boton.disabled = true;
        navigator.geolocation.getCurrentPosition((pos) => {
          campo.value = `https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
          campo.classList.add('listo');
          boton.textContent = '✅ Ubicación guardada'; boton.disabled = false;
        }, () => {
          alert('No se pudo obtener la ubicación. Revisa que el GPS esté encendido y que diste permiso.');
          boton.textContent = texto; boton.disabled = false;
        }, { enableHighAccuracy: true, timeout: 20000 });
      });
    });

    $('modoCompra').addEventListener('click', () => cambiarModo('compra'));
    $('modoMandado').addEventListener('click', () => cambiarModo('mandado'));

    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

    function guardar() {
      try {
        localStorage.setItem(CLAVE, JSON.stringify({ items, quien: $('quien').value, nota: $('notaGeneral').value }));
        localStorage.setItem('pedido-nombre', $('quien').value);
        localStorage.setItem('pedido-tel', $('quienTel').value);
      } catch (e) {}
    }

    function detalle(it) {
      if (!it.recoger) return [it.categoria, it.nota].filter(Boolean);
      const recoger = [it.lugar, it.direccion, it.telefono && 'Tel. ' + it.telefono, it.ubicacion && '📍 ' + it.ubicacion].filter(Boolean).join(', ');
      const entregar = [it.entregaContacto, it.entrega, it.entregaTelefono && 'Tel. ' + it.entregaTelefono, it.entregaUbicacion && '📍 ' + it.entregaUbicacion]
        .filter(Boolean).join(', ');
      return [
        recoger && 'Recoger: ' + recoger,
        entregar && 'Entregar: ' + entregar,
        it.yaPagado ? 'Ya está pagado' : 'Hay que pagarlo',
        it.nota,
      ].filter(Boolean);
    }

    function pintar() {
      $('cuenta').textContent = items.length;
      $('enviar').disabled = items.length === 0;
      if (!items.length) { $('lista').innerHTML = '<div class="vacio">Todavía no has agregado nada.</div>'; return; }
      const grupos = {};
      items.forEach((it, idx) => {
        const g = it.recoger ? '📦 Mandados (traer o llevar)' : '📍 ' + (it.lugar || 'Cualquier lugar');
        (grupos[g] = grupos[g] || []).push([it, idx]);
      });
      $('lista').innerHTML = Object.entries(grupos).map(([grupo, lista]) =>
        `<div class="grupo">${esc(grupo)}</div><ul>` + lista.map(([it, idx]) => `
          <li><div class="info">
            <div class="nombre">${it.cantidad ? esc(it.cantidad) + ' ' : ''}${esc(it.nombre)}</div>
            <div class="det">${detalle(it).map(esc).join(' · ')}</div>
          </div><button type="button" data-quitar="${idx}">Quitar</button></li>`).join('') + '</ul>'
      ).join('');
    }

    $('lista').addEventListener('click', (e) => {
      const idx = e.target.getAttribute && e.target.getAttribute('data-quitar');
      if (idx !== null && idx !== undefined) { items.splice(Number(idx), 1); guardar(); pintar(); }
    });

    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = $('nombre').value.trim();
      if (!nombre) return;
      if (modo === 'mandado') {
        const campos = ['lugarMandado', 'direccion', 'telefono', 'ubicacion', 'entregaContacto', 'entrega', 'entregaTelefono', 'entregaUbicacion'];
        const v = Object.fromEntries(campos.map((id) => [id, $(id).value.trim()]));
        if (!v.lugarMandado && !v.direccion && !v.telefono && !v.ubicacion) {
          alert('Escribe dónde se recoge: el lugar, la dirección, un teléfono o la ubicación.');
          $('lugarMandado').focus();
          return;
        }
        items.push({
          recoger: true, nombre, cantidad: '', categoria: '',
          lugar: v.lugarMandado, direccion: v.direccion, telefono: v.telefono, ubicacion: v.ubicacion,
          entregaContacto: v.entregaContacto, entrega: v.entrega, entregaTelefono: v.entregaTelefono, entregaUbicacion: v.entregaUbicacion,
          yaPagado: document.querySelector('input[name="pago"]:checked').value === 'pagado',
          nota: $('nota').value.trim(),
        });
        campos.forEach((id) => { $(id).value = ''; $(id).classList.remove('listo'); });
        document.querySelectorAll('[data-ubic]').forEach((b) => { b.textContent = '📍 Usar mi ubicación actual'; });
        document.querySelector('input[name="pago"][value="pagar"]').checked = true;
      } else {
        const lugar = $('lugar').value === '__otro' ? $('otroLugar').value.trim() : $('lugar').value;
        items.push({ nombre, cantidad: $('cantidad').value.trim(), lugar, categoria: $('categoria').value, nota: $('nota').value.trim() });
      }
      $('nombre').value = ''; $('cantidad').value = ''; $('nota').value = '';
      $('ok').textContent = `✅ "${nombre}" agregado`;
      setTimeout(() => { $('ok').textContent = ''; }, 2000);
      guardar(); pintar();
      $('nombre').focus();
    });

    $('quien').addEventListener('input', guardar);
    $('quienTel').addEventListener('input', guardar);
    $('notaGeneral').addEventListener('input', guardar);

    function codificar(texto) {
      const bytes = new TextEncoder().encode(texto);
      let bin = '';
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    $('enviar').addEventListener('click', () => {
      const quien = $('quien').value.trim();
      if (!quien) { alert('Escribe tu nombre para que sepan quién lo pide.'); $('quien').focus(); return; }
      const nota = $('notaGeneral').value.trim();
      const codigo = codificar(JSON.stringify({
        v: 1, de: quien, nota,
        tel: $('quienTel').value.trim(),
        // mismo orden que lee la app: [nombre, cantidad, lugar, categoría, nota, 'r', dirección, teléfono, pagado,
        //   dirección de entrega, ubicación de recogida, quién recibe, teléfono de quien recibe, ubicación de entrega]
        i: items.map((x) => x.recoger
          ? [x.nombre, x.cantidad, x.lugar, '', x.nota, 'r', x.direccion, x.telefono, x.yaPagado ? 1 : 0,
             x.entrega, x.ubicacion, x.entregaContacto, x.entregaTelefono, x.entregaUbicacion]
          : [x.nombre, x.cantidad, x.lugar, x.categoria, x.nota]),
      }));
      const lineas = [`🛒 *Pedido de ${quien}*`];
      if ($('quienTel').value.trim()) lineas.push(`📞 ${$('quienTel').value.trim()}`);
      lineas.push('');
      items.forEach((x) => {
        if (x.recoger) {
          lineas.push(`📦 ${x.cantidad ? x.cantidad + ' ' : ''}${x.nombre}`);
          detalle(x).forEach((d) => lineas.push(`     ${d}`));
          return;
        }
        const extra = [x.lugar && `📍 ${x.lugar}`, x.nota].filter(Boolean).join(' · ');
        lineas.push(`• ${x.cantidad ? x.cantidad + ' ' : ''}${x.nombre}${extra ? ` (${extra})` : ''}`);
      });
      if (nota) lineas.push('', `Nota: ${nota}`);
      lineas.push('', 'Código para la app Mandados:', `#MANDADO:${codigo}#`);
      const texto = lineas.join('\n');
      guardar();
      // api.whatsapp.com y no wa.me: la redirección de wa.me daña los emojis
      location.href = `https://api.whatsapp.com/send?${tel ? `phone=${tel}&` : ''}text=${encodeURIComponent(texto)}`;
    });

    pintar();
  </script>
</body>
</html>
